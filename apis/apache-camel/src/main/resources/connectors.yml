- name: http
  description: HTTP/HTTPS producer using Camel HTTP component.
  schemes:
    - http
    - https
  operations:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - HEAD
    - OPTIONS
  requiredConfig:
    - host
  optionalConfig:
    - path
    - queryParameters
    - httpMethod
  requiredAuth: []
  optionalAuth:
    - username
    - password
    - token
  notes:
    - "Use configuration.host as host (with optional scheme)."
    - "Pass headers such as Content-Type and Accept via headers."
    - "For basic auth, use auth.type=basic with username and password."

- name: sql
  description: Execute SQL queries against a JDBC datasource.
  schemes:
    - sql
  operations:
    - query
    - select
    - insert
    - update
    - delete
    - execute
  requiredConfig:
    - query
  optionalConfig:
    - useMessageBodyForParameters
    - outputType
  requiredAuth:
    - url
    - username
  optionalAuth:
    - password
  notes:
    - "Use auth.type=database with url, username, password."
    - "Credentials may be embedded in the URL userinfo (postgresql://user:pass@host/db); percent-encoded characters are decoded."
    - "Use payload to provide query parameters as a List or Map."

- name: jdbc
  description: Raw JDBC endpoint for executing statements via Camel JDBC.
  schemes:
    - jdbc
  operations:
    - execute
  requiredConfig:
    - dataSourceName
  optionalConfig:
    - readSize
    - outputClass
  requiredAuth:
    - url
    - username
  optionalAuth:
    - password
  notes:
    - "Use auth.type=database with url, username, password."
    - "Credentials may be embedded in the URL userinfo (postgresql://user:pass@host/db); percent-encoded characters are decoded."
    - "dataSourceName is the bean name exposed to the Camel registry."

- name: file
  description: Read from or write to the local filesystem.
  schemes:
    - file
  operations:
    - read
    - write
    - append
  requiredConfig:
    - directoryName
  optionalConfig:
    - fileName
    - doneFileName
    - flatten
    - charset
  requiredAuth: []
  optionalAuth: []
  notes:
    - "Use operation=write to produce a file."
    - "The payload body becomes the file content."

- name: ftp
  description: FTP/FTPS/SFTP file transfer using Camel FTP component.
  schemes:
    - ftp
    - ftps
    - sftp
  operations:
    - read
    - write
    - append
    - delete
    - list
    - check
  requiredConfig:
    - host
    - directoryName
  optionalConfig:
    - port
    - fileName
    - passiveMode
    - binary
    - strictHostKeyChecking
    - appendPosition
  requiredAuth:
    - username
  optionalAuth:
    - password
    - privateKey
    - privateKeyPassphrase
  notes:
    - "Use auth.type=basic with username and password."
    - "For SFTP key-based auth, use auth.properties.privateKey."
    - "appendPosition controls where append inserts the payload: start, end (default), or a numeric character offset."

- name: jms
  description: Send or receive JMS messages via Camel JMS.
  schemes:
    - jms
  operations:
    - send
    - request
    - browse
  requiredConfig:
    - destinationName
  optionalConfig:
    - connectionFactory
    - deliveryMode
    - timeToLive
    - replyTo
  requiredAuth:
    - brokerUrl
  optionalAuth:
    - username
    - password
  notes:
    - "Use auth.type=basic with brokerUrl, username, password; a per-request connection factory is created."
    - "destinationName is the queue or topic name."

- name: kafka
  description: Produce or consume records from Apache Kafka.
  schemes:
    - kafka
  operations:
    - send
    - poll
    - fetch
  requiredConfig:
    - topic
    - brokers
  optionalConfig:
    - groupId
    - key
    - partitionKey
    - offset
    - autoCommitEnable
  requiredAuth: []
  optionalAuth:
    - username
    - password
    - token
    - saslMechanism
  notes:
    - "Use auth.type=basic or auth.type=bearer depending on your Kafka security setup."
    - "For SASL/SSL use auth.properties.saslMechanism and additional properties."

- name: mail
  description: Send or receive email via SMTP/SMTPS/IMAP/POP3.
  schemes:
    - smtp
    - smtps
    - imap
    - imaps
    - pop3
    - pop3s
  operations:
    - send
    - read
    - search
    - delete
  requiredConfig:
    - host
    - to
  optionalConfig:
    - port
    - subject
    - from
    - contentType
  requiredAuth:
    - username
  optionalAuth:
    - password
  notes:
    - "Use auth.type=basic with username and password."
    - "For send operations, use headers.To/Subject/From or configuration equivalents."

