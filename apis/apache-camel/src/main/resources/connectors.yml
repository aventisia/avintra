    - contentType
    - authorizationCode
    - redirectUri
    - deviceCode
    - assertion
  requiredAuth: []
  optionalAuth:
    - tenantId
    - clientId
    - clientSecret
    - refreshToken
    - tokenUrl
    - scopes
    - token
    - apiKey
    - apiKeyHeader
    - authorizationCode
    - redirectUri
    - deviceCode
    - assertion
  notes:
    - "Use operation=<service>.<action>, e.g. user.get or mail.send."
    - "Path parameters (userId, groupId, messageId, ...) are read from configuration."
    - "Auth types: accessToken (token) for a pre-generated Graph bearer token; oauth2 (tenantId/clientId/clientSecret + optional refreshToken) for Entra ID authorization-code or refresh flow; client_credentials (tenantId/clientId/clientSecret) for app-only."
    - "Additional OAuth flows: authorization_code (authorizationCode + redirectUri), refresh_token (refreshToken), device_code (deviceCode; start with auth.device-code-start then poll auth.device-code-poll), on_behalf_of (assertion JWT for OBO)."
    - "Auth operations: auth.get-token (client_credentials), auth.authorization-code, auth.refresh-token, auth.device-code-start, auth.device-code-poll, auth.on-behalf-of."
    - "baseUrl overrides the default https://graph.microsoft.com/v1.0 for Graph endpoints (e.g. test/dedicated cloud)."
    - "OData query options ($filter, $select, $expand, $orderby, $top, $skiptoken, $search) are passed via configuration."
    - "Pagination follows @odata.nextLink for list operations; cap pages with configuration.maxPages or enable autoPaginate=true."
    - "Transient failures (500/502/503/504/429) are retried with backoff; Retry-After is honored for throttling."
    - "Errors carry a canonical errorType (invalid_input, missing_parameter, authentication_failed, insufficient_permissions, not_found, conflict, rate_limited, provider_error, network_error, timeout, unsupported_operation, unknown) plus graphCode when available."
    - "Credentials and tokens are never echoed in responses or logs."
    - "Capability matrix: docs/m365/capability-matrix.md; per-service reference: docs/m365/actions-<service>.md; audit: docs/m365-capabilities-audit.md."
