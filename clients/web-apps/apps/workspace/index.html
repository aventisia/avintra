<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_COMPANY_NAME%</title>
    <!-- IMPORTANT NOTE: shown until React mounts, before the app CSS loads, so it repeats the --bg colours from tailwind.css; the production CSP blocks inline scripts, so the stored theme cannot be read here. -->
    <style>
      .boot-loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f7f7f9;
      }
      .boot-loader::after {
        content: "";
        width: 20px;
        height: 20px;
        border: 2px solid rgb(128 128 128 / 0.45);
        border-top-color: transparent;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        .boot-loader {
          background: #09090d;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loader::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-loader" role="status" aria-label="Loading"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
