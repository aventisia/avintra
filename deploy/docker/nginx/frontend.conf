server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    # IMPORTANT NOTE: keep absolute_redirect off, or directory redirects point at :8080.
    absolute_redirect off;

    location = / { return 302 /accounts/; }
    location ~ ^/(accounts|workspace|studio)/assets/ { try_files $uri =404; }
    location = /workspace/chat-preview.html {
        include /etc/nginx/snippets/common_chat_preview_headers.conf;
        try_files $uri =404;
    }
    location /accounts/ { try_files $uri $uri.html $uri/ /accounts/index.html; }
    location /workspace/ { try_files $uri $uri.html $uri/ /workspace/index.html; }
    location /studio/ { try_files $uri $uri.html $uri/ /studio/index.html; }
}
