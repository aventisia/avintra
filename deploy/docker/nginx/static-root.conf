server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    # IMPORTANT NOTE: keep absolute_redirect off, or directory redirects point at :8080.
    absolute_redirect off;
    error_page 404 /404.html;

    location ~ ^/(assets|_next|_pagefind)/ { try_files $uri =404; }
    location / { try_files $uri $uri.html $uri/ =404; }
}
