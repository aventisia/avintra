<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #333;
      }
      .container {
        text-align: center;
        background: transparent;
        padding: 3rem 2rem;
        border-radius: 20px;
      }
      .container div {
        display: flex;
        gap: 1.2rem;
        align-items: center;
        margin-bottom: 2rem;
      }
      .container div span {
        width: 1px;
        height: 2.4rem;
        margin-bottom: -0.5rem;
        border: 1px solid #64748bd7;
      }
      h1 {
        font-size: 2.5rem;
        color: rgb(30, 27, 75);
      }
      h2 {
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: -0.2rem;
        color: rgb(30, 27, 75);
      }
      p {
        font-size: 1rem;
        color: #64748bd7;
        margin-bottom: 2rem;
      }
      a {
        display: inline-block;
        padding: 8px 20px 10px 20px;
        background: rgb(79, 70, 229);
        color: white;
        text-decoration: none;
        border-radius: 0.4rem;
        font-size: 0.8rem;
        font-weight: 600;
        transition: all 0.3s;
      }
      a:hover {
        background: rgb(84, 76, 236);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <h1>404</h1>
        <span></span>
        <h2>Page not found</h2>
      </div>
      <a href="/">Go to Homepage</a>
    </div>
  </body>
</html>
