# IMPORTANT NOTE: replaces common_headers.conf for /workspace/chat-preview.html, which runs untrusted generated HTML. Keep this policy in step with the meta copy in clients/web-apps/apps/workspace/public/chat-preview.html.
add_header Server "" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cache-Control "no-cache" always;
add_header Content-Security-Policy "sandbox allow-scripts allow-forms allow-modals; default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com data:; img-src data: blob: https:; media-src data: blob: https:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-src 'self'; frame-ancestors 'self'" always;
