server
{
	listen 80;
	server_name ${APP_BASE_URL};
	return 301 https://$host$request_uri;
}

server
{
	listen 443 ssl;
	http2 on;
	server_name ${APP_BASE_URL};

	# Include common config
	include /etc/nginx/snippets/common_ssl.conf;
	include /etc/nginx/snippets/common_headers.conf;

	# Custom error pages
	error_page 404 /404.html;
	error_page 502 /502.html;
	
	location ~ ^/(404|502)\.html$ {
		root /usr/share/nginx/html;
		internal;
	}

	# ----------------- Health Check -----------------
	location /health {
		access_log off;
		default_type text/plain;
		return 200 "OK\n";
	}

	# ----------------- /files/binaries (public binary downloads) -----------------
	location /files/binaries/ {
		proxy_pass http://accounts-apis:4000/api/binaries/;
		include /etc/nginx/snippets/common_api_config.conf;
	}

	# ----------------- /accounts -----------------
	location ~ ^/accounts/api/(auth|me) {
		gzip off;
		rewrite ^/accounts/api/(.*)$ /api/$1 break; # Strip /accounts/ from the start of the URI
		proxy_pass http://accounts-apis:4000;
		include /etc/nginx/snippets/common_api_config.conf;
	}

	location /accounts/api/ {
		proxy_pass http://accounts-apis:4000/api/;
		include /etc/nginx/snippets/common_api_config.conf;
	}

	location /accounts/assets/ {
		alias /usr/share/nginx/html/accounts/assets/;
		try_files $uri =404;
	}

	location /accounts/ {
		alias /usr/share/nginx/html/accounts/;
    	try_files $uri $uri.html $uri/ /index.html =404;
	}

	# ----------------- /studio -----------------
	location /studio/assets/ {
		alias /usr/share/nginx/html/studio/assets/;
		try_files $uri =404;
	}

	location /studio/ {
		alias /usr/share/nginx/html/studio/;
		try_files $uri $uri.html $uri/ /index.html =404;
	}

	# ----------------- /llmpipeline -----------------
	location /llmpipeline/api/ {
		proxy_pass http://llmpipeline-apis:4003/api/;
		include /etc/nginx/snippets/common_api_config.conf;
	}

	# ----------------- /livekit -----------------
	# IMPORTANT NOTE: no common_api_config.conf; its timeouts would cut voice calls.
	# IMPORTANT NOTE: the variable upstream lets the edge start when voice uses LiveKit Cloud and no livekit container runs.
	location /livekit/ {
		resolver 127.0.0.11 valid=30s;
		set $livekit_upstream http://livekit:7880;
		rewrite ^/livekit/(.*)$ /$1 break;
		proxy_pass $livekit_upstream;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		proxy_read_timeout 86400s;
		proxy_send_timeout 86400s;
	}

	# ----------------- /workspace -----------------
	location ~ ^/workspace/api/(vault-credential) {
        gzip off;
		rewrite ^/workspace/api/(.*)$ /api/$1 break; # Strip /workspace/ from the start of the URI
		proxy_pass http://workspace-apis:4001;
		include /etc/nginx/snippets/common_api_config.conf;
    }

	location /workspace/api/ {
		proxy_pass http://workspace-apis:4001/api/;
		include /etc/nginx/snippets/common_api_config.conf;
	}

	location /workspace/assets/ {
		alias /usr/share/nginx/html/workspace/assets/;
		try_files $uri =404;
	}

	location = /workspace/chat-preview.html {
		alias /usr/share/nginx/html/workspace/chat-preview.html;
		include /etc/nginx/snippets/common_chat_preview_headers.conf;
	}

	location /workspace/ {
		alias /usr/share/nginx/html/workspace/;
		try_files $uri $uri.html $uri/ /index.html =404;
	}

	# ----------------- Static files / downloads -----------------
	location /files/ {
		alias /var/www/aventisia.com/files/;
		# Large self-contained runner zips may take time on slower connections.
		send_timeout 300s;
		client_body_timeout 300s;
		# Disable gzip for binary downloads; the zip is already compressed.
		gzip off;
		# Allow byte-range requests for resumable downloads.
		add_header Accept-Ranges bytes;
	}

	# ----------------- Default -----------------
	location = / {
		return 301 /accounts/;
	}
}