add_header Server "" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), fullscreen=(self), payment=(), usb=()" always;
# IMPORTANT NOTE: this single config serves both ${APP_BASE_URL} and uat-${APP_BASE_URL}, so both
# globaladmin API hosts stay allowed here until the frontend config is split per environment.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'${CSP_SCRIPT_SRC}; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com data:; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; frame-src 'self'${CSP_FRAME_SRC}; connect-src 'self' blob: https://${APP_BASE_URL} https://avintra.aventisia.com https://uat-avintra.aventisia.com https://globaladmin.aventisia.com https://uat-globaladmin.aventisia.com${CSP_CONNECT_SRC} $csp_tauri_extra;" always;