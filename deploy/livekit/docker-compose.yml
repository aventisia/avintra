# LiveKit runs independently of dekit. Start it before llmpipeline:
#   docker compose -f deploy/livekit/docker-compose.yml up -d
#   docker compose -f deploy/livekit/docker-compose.yml down
#
# --dev uses LiveKit's documented devkey/secret pair. Never use it in production.
# --node-ip advertises the address browsers should use for WebRTC media. The
# default works for a browser on this host; set LIVEKIT_NODE_IP to the host's
# LAN IP when callers connect from another machine.
#
# A second checkout on the same host exports the three *_PORT variables in the
# shell before `docker compose up` so its server does not collide, and points
# LIVEKIT_WS_URL/LIVEKIT_HTTP_URL in its apis/llmpipeline/.env.local at the same
# host port.
services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    command:
      - --dev
      - --bind
      - 0.0.0.0
      - --node-ip
      - ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"
    restart: "no"
